name: BalizticZero
options:
  bundleIdPrefix: com.balizticzero
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # Signed by the owner's team so WeatherKit works. CI passes CODE_SIGNING_ALLOWED=NO and builds unsigned.
    DEVELOPMENT_TEAM: TRSF93SDY9
    CODE_SIGN_STYLE: Automatic
    ENABLE_TESTABILITY: YES
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  BalizticZero:
    type: application
    platform: iOS
    sources:
      - path: BalizticZero
        excludes:
          - Info.plist
          - BalizticZero.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.balizticzero.app
        PRODUCT_NAME: BalizticZero
        INFOPLIST_FILE: BalizticZero/Info.plist
        CODE_SIGN_ENTITLEMENTS: BalizticZero/BalizticZero.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Baliztic Zero"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  BalizticZeroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BalizticZeroTests
    dependencies:
      - target: BalizticZero
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.balizticzero.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BalizticZero.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BalizticZero"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  BalizticZero:
    build:
      targets:
        BalizticZero: all
        BalizticZeroTests: [test]
    test:
      config: Debug
      targets:
        - BalizticZeroTests
